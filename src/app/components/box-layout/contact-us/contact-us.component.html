<div class="contact-container flex justify-between p-6 rounded-lg shadow-lg">
  <!-- Left Section -->
  <div class="left-section w-full md:w-1/2 text-start">
    <h1 class="main-title text-3xl font-semibold text-white leading-tight">
      Ask whatever you have<br /><span class="text-[#91B0FF]"
        >in your mind now
      </span>
    </h1>
    <p class="subtitle text-lg text-white mt-4">
      Whether you have questions or are ready to discuss your business, we're
      here to help. Reach out today.
    </p>

    <div class="contact-info mt-6">
      <div class="info-item flex items-center mb-4">
        <img
          src="https://dashboard.codeparrot.ai/api/image/Z7GXNI9nxTWt8i9D/mdi-emai.png"
          alt="email"
          width="24"
          height="24"
          class="mr-3"
        />
        <a
          href="mailto:contact@adtask.ai"
          class="info-text text-blue-600 underline"
        >
          contact&#64;adtask.ai
        </a>
      </div>
      <div class="info-item flex items-center mb-4">
        <img
          src="https://dashboard.codeparrot.ai/api/image/Z7GXNI9nxTWt8i9D/mdi-phon.png"
          alt="phone"
          width="24"
          height="24"
          class="mr-3"
        />
        <span class="info-text text-white">(969) 819-8061</span>
      </div>
      <div class="info-item flex items-center mb-4">
        <img
          src="https://dashboard.codeparrot.ai/api/image/Z7GXNI9nxTWt8i9D/mdi-addr.png"
          alt="address"
          width="24"
          height="24"
          class="mr-3"
        />
        <span class="info-text text-white">San Francisco Bay Area</span>
      </div>
    </div>
  </div>

  <!-- Right Section -->
  <div class="right-section w-full md:w-1/2">
    <div class="form-group mb-4">
      <label class="block text-sm font-medium text-gray-700 text-start"
        >Name</label
      >
      <input
        type="text"
        [(ngModel)]="name"
        class="form-input mt-1 p-3 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div class="form-group mb-4">
      <label class="block text-sm font-medium text-gray-700 text-start"
        >Email</label
      >
      <input
        type="email"
        [(ngModel)]="email"
        class="form-input mt-1 p-3 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div class="form-group mb-4">
      <label class="block text-sm font-medium text-gray-700 text-start"
        >Message</label
      >
      <textarea
        [(ngModel)]="message"
        class="form-input mt-1 p-3 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      ></textarea>
    </div>
    <div class="flex justify-center">
      <div
        class="trial-button relative text-center py-3 px-6 bg-blue-600 text-white rounded-lg cursor-pointer transition-transform duration-300 hover:scale-105"
        [style.width.px]="width1"
        [style.height.px]="height1"
      >
        <img
          [src]="particle1"
          class="particle particle-1 absolute top-0 left-0 w-6 h-6"
          alt="particle"
        />
        <img
          [src]="particle2"
          class="particle particle-2 absolute bottom-0 right-0 w-6 h-6"
          alt="particle"
        />
        <div class="text">Submit</div>
      </div>
    </div>
  </div>
</div>
